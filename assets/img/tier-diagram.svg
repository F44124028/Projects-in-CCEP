<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="1" stop-color="#F4EEE3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="430" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#3D2817">高齡友善學習環境三層次架構</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#8A6A50">對照悠然山莊現況評估</text>

  <!-- connecting baseline -->
  <line x1="90" y1="130" x2="910" y2="130" stroke="#D9C4A8" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Box 1: 可用 -->
  <rect x="40" y="95" width="260" height="180" rx="14" fill="#F4EEE3" stroke="#B98C5E" stroke-width="1.6"/>
  <text x="170" y="130" text-anchor="middle" font-size="12" letter-spacing="2" fill="#9A7350">無障礙設計</text>
  <text x="170" y="168" text-anchor="middle" font-size="34" font-weight="700" fill="#5B3A29">可用</text>
  <line x1="115" y1="185" x2="225" y2="185" stroke="#D9C4A8" stroke-width="1.4"/>
  <text x="170" y="212" text-anchor="middle" font-size="13" fill="#5B3A29">
    <tspan x="170" dy="0">法規、消防安全</tspan>
    <tspan x="170" dy="20">動線設計基本達標</tspan>
  </text>
  <rect x="70" y="240" width="200" height="26" rx="13" fill="#EADCC7"/>
  <text x="170" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7A5A3A">已達成</text>

  <!-- Arrow 1 -->
  <path d="M 305 185 L 355 185 L 340 175 M 355 185 L 340 195" fill="none" stroke="#C98B4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Box 2: 好用 -->
  <rect x="370" y="95" width="260" height="180" rx="14" fill="#E4C9A6" stroke="#B57A3E" stroke-width="1.6"/>
  <text x="500" y="130" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7A5228">通用設計</text>
  <text x="500" y="168" text-anchor="middle" font-size="34" font-weight="700" fill="#4A2E14">好用</text>
  <line x1="440" y1="185" x2="560" y2="185" stroke="#C9A876" stroke-width="1.4"/>
  <text x="500" y="212" text-anchor="middle" font-size="13" fill="#4A2E14">
    <tspan x="500" dy="0">彈性使用、社交節點</tspan>
    <tspan x="500" dy="20">維護明顯不足</tspan>
  </text>
  <rect x="390" y="240" width="220" height="26" rx="13" fill="#D9B98A"/>
  <text x="500" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A3A1A">明顯缺口</text>

  <!-- Arrow 2 -->
  <path d="M 635 185 L 685 185 L 670 175 M 685 185 L 670 195" fill="none" stroke="#8B5A2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Box 3: 喜歡用 -->
  <rect x="700" y="95" width="260" height="180" rx="14" fill="#6B4226" stroke="#4A2C16" stroke-width="1.6"/>
  <text x="830" y="130" text-anchor="middle" font-size="12" letter-spacing="2" fill="#E4C9A6">友善環境設計</text>
  <text x="830" y="168" text-anchor="middle" font-size="34" font-weight="700" fill="#FBF7F1">喜歡用</text>
  <line x1="765" y1="185" x2="895" y2="185" stroke="#8A6642" stroke-width="1.4"/>
  <text x="830" y="212" text-anchor="middle" font-size="13" fill="#F0DCC5">
    <tspan x="830" dy="0">自主、歸屬感</tspan>
    <tspan x="830" dy="20">核心缺口</tspan>
  </text>
  <rect x="740" y="240" width="180" height="26" rx="13" fill="#4A2C16"/>
  <text x="830" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F0DCC5">核心缺口</text>

  <!-- Bottom note -->
  <text x="500" y="310" text-anchor="middle" font-size="12.5" fill="#9A7350">空間存在（可用）不等於空間被喜歡使用——悠然山莊的落差，多數卡在「好用」與「喜歡用」之間</text>

  <!-- Source -->
  <text x="500" y="390" text-anchor="middle" font-size="10.5" fill="#B7A188">資料來源：張德永主編《高齡教學創意方案》高齡友善學習環境的指引；本研究訪談對照分析</text>
</svg>
